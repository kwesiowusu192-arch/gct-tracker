<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCT Letter Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg:#F7F8FA; --surface:#FFFFFF; --border:#E4E7EC; --border-strong:#C8CFDA;
    --text-primary:#0F1621; --text-secondary:#5C6B80; --text-muted:#8A97A8;
    --blue:#1B4FBB; --blue-light:#EBF0FB; --blue-mid:#3B6FDF;
    --red:#B42318; --gold:#92600A; --gold-light:#FEF6E7;
    --radius:10px; --radius-sm:6px;
    --shadow:0 1px 3px rgba(15,22,33,0.08); --shadow-md:0 4px 12px rgba(15,22,33,0.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;font-size:14px;line-height:1.5;}
  input,button{font-family:inherit;font-size:14px;}
  input[type="text"],input[type="password"]{border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 12px;outline:none;background:var(--surface);color:var(--text-primary);width:100%;transition:border-color 0.15s;}
  input:focus{border-color:var(--blue-mid);box-shadow:0 0 0 3px rgba(59,111,223,0.12);}
  .screen{display:none;}
  .screen.active{display:block;}

  /* LOGIN */
  #loginScreen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:2rem;}
  #loginScreen.active{display:flex;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-md);padding:2.5rem 2rem;width:100%;max-width:420px;}
  .login-logo{display:flex;align-items:center;gap:10px;margin-bottom:1.75rem;}
  .logo-mark{width:40px;height:40px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:15px;flex-shrink:0;}
  .logo-text strong{font-size:15px;font-weight:600;display:block;}
  .logo-text span{font-size:11px;color:var(--text-muted);}
  .login-card h2{font-size:17px;font-weight:600;margin-bottom:4px;}
  .login-card>p{font-size:13px;color:var(--text-secondary);margin-bottom:1.5rem;}
  .user-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.25rem;}
  .user-card{border:1.5px solid var(--border);border-radius:var(--radius);padding:12px 10px;cursor:pointer;text-align:center;background:var(--surface);transition:border-color 0.15s,background 0.15s;}
  .user-card:hover{border-color:var(--blue-mid);background:var(--blue-light);}
  .user-card.selected{border-color:var(--blue);background:var(--blue-light);}
  .avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;margin:0 auto 8px;}
  .u-name{font-size:13px;font-weight:500;}
  .u-role{font-size:10px;color:var(--text-muted);margin-top:2px;line-height:1.3;}
  .pin-field{margin-bottom:1rem;}
  .pin-field label{font-size:12px;color:var(--text-secondary);display:block;margin-bottom:5px;font-weight:500;}
  .login-btn{width:100%;background:var(--blue);color:white;border:none;border-radius:var(--radius-sm);height:42px;font-size:14px;font-weight:500;cursor:pointer;}
  .login-btn:hover{background:var(--blue-mid);}
  .err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px;}

  /* TRACKER */
  #trackerScreen{min-height:100vh;display:none;flex-direction:column;}
  #trackerScreen.active{display:flex;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .topbar-left{display:flex;align-items:center;gap:10px;}
  .topbar-logo{display:flex;align-items:center;gap:8px;}
  .topbar-logo .logo-mark{width:30px;height:30px;font-size:11px;border-radius:7px;}
  .topbar-logo span{font-size:13px;font-weight:600;}
  .topbar-sep{width:1px;height:20px;background:var(--border);margin:0 4px;}
  .topbar-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}
  .topbar-name{font-size:13px;font-weight:500;}
  .topbar-role{font-size:11px;color:var(--text-muted);}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block;transition:background 0.3s;}
  .sync-dot.live{background:#22C55E;}
  .sync-dot.connecting{background:var(--gold);animation:pulse 1s infinite;}
  .sync-dot.error{background:var(--red);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .sync-label{font-size:11px;color:var(--text-muted);}
  .logout-btn{background:none;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:0 12px;height:30px;font-size:12px;cursor:pointer;color:var(--text-secondary);}
  .logout-btn:hover{background:var(--bg);}
  .main{flex:1;display:grid;grid-template-columns:1fr 340px;gap:1.5rem;max-width:960px;margin:0 auto;width:100%;padding:2rem 1.5rem;}
  @media(max-width:700px){.main{grid-template-columns:1fr;padding:1.25rem 1rem;}.sidebar{order:-1;}}
  .counter-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:2.5rem 2rem;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .counter-eyebrow{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.5rem;font-weight:500;}
  .big-number{font-family:'JetBrains Mono',monospace;font-size:96px;font-weight:500;color:var(--text-primary);line-height:1;letter-spacing:-2px;transition:color 0.4s;}
  .last-by{font-size:12px;color:var(--text-secondary);margin-top:8px;min-height:18px;}
  .last-by strong{color:var(--text-primary);}
  .divider{border:none;border-top:1px solid var(--border);width:100%;margin:1.75rem 0;}
  .next-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.5rem;font-weight:500;}
  .next-num-display{font-family:'JetBrains Mono',monospace;font-size:42px;font-weight:500;color:var(--blue);background:var(--blue-light);border-radius:var(--radius);padding:0.75rem 1rem;margin-bottom:1rem;}
  .pick-btn{width:100%;background:var(--blue);color:white;border:none;border-radius:var(--radius-sm);height:48px;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:8px;}
  .pick-btn:hover{background:var(--blue-mid);}
  .pick-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .undo-btn{width:100%;background:none;border:1px solid var(--border-strong);border-radius:var(--radius-sm);height:36px;font-size:13px;cursor:pointer;color:var(--text-secondary);}
  .undo-btn:hover:not(:disabled){background:var(--bg);}
  .undo-btn:disabled{opacity:0.35;cursor:not-allowed;}
  .sidebar{display:flex;flex-direction:column;gap:1rem;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;}
  .panel-head{padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.05em;display:flex;align-items:center;justify-content:space-between;}
  .log-table{width:100%;border-collapse:collapse;font-size:12px;}
  .log-table td{padding:8px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .log-table tr:last-child td{border-bottom:none;}
  .log-table tr:hover td{background:var(--bg);}
  .log-num{font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--blue);font-size:13px;}
  .log-who{display:flex;align-items:center;gap:6px;}
  .log-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .log-meta{color:var(--text-muted);font-size:11px;}
  .empty-log{padding:1.5rem;text-align:center;color:var(--text-muted);font-size:12px;}
  .team-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);}
  .team-row:last-child{border-bottom:none;}
  .team-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
  .team-name{font-size:12px;font-weight:500;}
  .team-role{font-size:10px;color:var(--text-muted);}
  .team-badge{font-size:10px;background:var(--gold-light);color:var(--gold);border-radius:4px;padding:1px 6px;font-weight:500;}
  .admin-form{padding:14px;display:flex;flex-direction:column;gap:8px;}
  .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .admin-add-btn{background:var(--blue);color:white;border:none;border-radius:var(--radius-sm);height:34px;font-size:13px;font-weight:500;cursor:pointer;}
  .admin-add-btn:hover{background:var(--blue-mid);}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0F1621;color:white;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:opacity 0.25s;pointer-events:none;z-index:999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.25);}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div id="loginScreen" class="screen active">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-mark">GCT</div>
      <div class="logo-text">
        <strong>Ghana Chamber of Telecom</strong>
        <span>Letter Reference Tracker</span>
      </div>
    </div>
    <h2>Sign in</h2>
    <p>Select your name, then enter your PIN.</p>
    <div class="user-grid" id="userGrid"></div>
    <div class="pin-field">
      <label>PIN</label>
      <input type="password" id="pinInput" maxlength="4" placeholder="Enter your 4-digit PIN" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="trackerScreen" class="screen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">
        <div class="logo-mark">GCT</div>
        <span>Letter Tracker</span>
      </div>
      <div class="topbar-sep"></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="topbar-avatar" id="tbAvatar"></div>
        <div>
          <div class="topbar-name" id="tbName"></div>
          <div class="topbar-role" id="tbRole"></div>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="sync-dot connecting" id="syncDot"></span>
      <span class="sync-label" id="syncLabel">Connecting…</span>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="main">
    <div class="counter-panel">
      <div class="counter-eyebrow">Last number used</div>
      <div class="big-number" id="bigNum">000</div>
      <div class="last-by" id="lastBy">No letters logged yet</div>
      <div class="divider"></div>
      <div style="width:100%">
        <div class="next-label">Next number to use</div>
        <div class="next-num-display" id="nextNumDisplay">001</div>
        <button class="pick-btn" id="pickBtn" onclick="pickNumber()">
          Use number <span id="pickBtnNum">001</span>
        </button>
        <button class="undo-btn" id="undoBtn" onclick="undoNumber()" disabled>
          ↩ Undo my last entry
        </button>
      </div>
    </div>

    <div class="sidebar">
      <div class="panel">
        <div class="panel-head">
          <span>Usage log</span>
          <span id="logCount" style="font-weight:400;color:var(--text-muted)">0 entries</span>
        </div>
        <div id="logContainer" style="max-height:300px;overflow-y:auto;">
          <div class="empty-log">No letters logged yet</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">Team</div>
        <div id="teamList"></div>
      </div>

      <div class="panel" id="adminPanel" style="display:none">
        <div class="panel-head">Admin — add member</div>
        <div class="admin-form">
          <input type="text" id="aName" placeholder="Full name">
          <input type="text" id="aRole" placeholder="Role / title">
          <div class="admin-grid">
            <input type="password" id="aPin" maxlength="4" placeholder="PIN (4 digits)">
            <button class="admin-add-btn" onclick="addUser()">Add</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, set, push, remove, get } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

// ── FIREBASE CONFIG (your project) ─────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCh6rM63dw-QBkKVMX8yVJSg6cpGx8N6Fk",
  authDomain: "gct-tracker-367c4.firebaseapp.com",
  databaseURL: "https://gct-tracker-367c4-default-rtdb.firebaseio.com",
  projectId: "gct-tracker-367c4",
  storageBucket: "gct-tracker-367c4.firebasestorage.app",
  messagingSenderId: "727347840373",
  appId: "1:727347840373:web:ff3b131bea9b46605aff3c"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ── USERS ──────────────────────────────────────────────────
let users = [
  { id:1, name:"Obed",   role:"Digital Officer",              pin:"1984", isAdmin:true  },
  { id:2, name:"Bobbie", role:"Research, Comms & Regulatory", pin:"2001", isAdmin:false },
  { id:3, name:"David",  role:"Assist. Communications",       pin:"3003", isAdmin:false },
  { id:4, name:"Alaina", role:"Admin & HR",                   pin:"4004", isAdmin:false },
];
let nextUserId = 5;

const COLORS = [
  {bg:"#DBEAFE",text:"#1D4ED8"},{bg:"#D1FAE5",text:"#065F46"},
  {bg:"#FEF3C7",text:"#92400E"},{bg:"#EDE9FE",text:"#5B21B6"},
  {bg:"#FFE4E6",text:"#9F1239"},{bg:"#DCFCE7",text:"#166534"},
];
const clr  = id => COLORS[(id-1)%COLORS.length];
const ini  = n  => n.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
const pad  = n  => String(n).padStart(3,"0");
const byId = id => users.find(u=>u.id===id)||null;

// ── STATE ──────────────────────────────────────────────────
let activeUser     = null;
let selectedUserId = null;
let currentNum     = 0;
let logEntries     = [];
let lastKnown      = null;

// ── TOAST ──────────────────────────────────────────────────
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// ── SYNC STATUS ────────────────────────────────────────────
function setSyncStatus(s){
  document.getElementById('syncDot').className='sync-dot '+s;
  document.getElementById('syncLabel').textContent=
    s==='live'?'Live • Real-time':s==='connecting'?'Connecting…':'Connection error';
}

// ── FIREBASE LISTENERS ─────────────────────────────────────
onValue(ref(db,'tracker/current'), snap=>{
  currentNum = snap.val() ?? 0;
  setSyncStatus('live');
  if(activeUser) renderTracker();
});

onValue(ref(db,'tracker/log'), snap=>{
  const val = snap.val();
  logEntries = val ? Object.values(val).sort((a,b)=>a.num-b.num) : [];
  if(activeUser) renderLog();
});

// ── LOGIN ──────────────────────────────────────────────────
function renderLoginGrid(){
  document.getElementById('userGrid').innerHTML = users.map(u=>{
    const c=clr(u.id);
    return `<div class="user-card ${selectedUserId===u.id?'selected':''}" onclick="selectUser(${u.id})">
      <div class="avatar" style="background:${c.bg};color:${c.text}">${ini(u.name)}</div>
      <div class="u-name">${u.name}</div>
      <div class="u-role">${u.role}</div>
    </div>`;
  }).join('');
}

window.selectUser = id=>{
  selectedUserId=id;
  document.getElementById('pinInput').value='';
  document.getElementById('loginErr').textContent='';
  renderLoginGrid();
  document.getElementById('pinInput').focus();
};

window.doLogin = ()=>{
  if(!selectedUserId){document.getElementById('loginErr').textContent='Please select your name.';return;}
  const pin=document.getElementById('pinInput').value;
  const user=byId(selectedUserId);
  if(!user||user.pin!==pin){document.getElementById('loginErr').textContent='Incorrect PIN — try again.';return;}
  activeUser=user;
  document.getElementById('loginErr').textContent='';
  showTracker();
};

window.logout = ()=>{
  activeUser=null; selectedUserId=null;
  document.getElementById('pinInput').value='';
  document.getElementById('trackerScreen').classList.remove('active');
  document.getElementById('loginScreen').classList.add('active');
  renderLoginGrid();
};

// ── TRACKER ────────────────────────────────────────────────
function showTracker(){
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('trackerScreen').classList.add('active');
  const c=clr(activeUser.id);
  const av=document.getElementById('tbAvatar');
  av.textContent=ini(activeUser.name);
  av.style.background=c.bg; av.style.color=c.text;
  document.getElementById('tbName').textContent=activeUser.name;
  document.getElementById('tbRole').textContent=activeUser.role;
  document.getElementById('adminPanel').style.display=activeUser.isAdmin?'block':'none';
  renderTracker();
  renderTeam();
}

function renderTracker(){
  const next=currentNum+1;
  document.getElementById('bigNum').textContent=pad(currentNum);
  document.getElementById('nextNumDisplay').textContent=pad(next);
  document.getElementById('pickBtnNum').textContent=pad(next);

  if(logEntries.length){
    const last=logEntries[logEntries.length-1];
    const u=byId(last.userId);
    document.getElementById('lastBy').innerHTML=
      `Used by <strong>${u?u.name:'Someone'}</strong> · ${last.date} at ${last.time}`;
  } else {
    document.getElementById('lastBy').textContent='No letters logged yet';
  }

  const lastEntry=logEntries.length?logEntries[logEntries.length-1]:null;
  document.getElementById('undoBtn').disabled=!(lastEntry&&lastEntry.userId===activeUser.id);

  // notify if another user changed the number
  if(lastKnown!==null && lastKnown!==currentNum && lastEntry){
    const u=byId(lastEntry.userId);
    document.getElementById('bigNum').style.color='#1B4FBB';
    setTimeout(()=>document.getElementById('bigNum').style.color='',700);
    if(u && u.id!==activeUser.id) toast(`${u.name} just used number ${pad(currentNum)}`);
  }
  lastKnown=currentNum;
  renderLog();
}

function renderLog(){
  const entries=[...logEntries].reverse();
  document.getElementById('logCount').textContent=`${logEntries.length} ${logEntries.length===1?'entry':'entries'}`;
  const c=document.getElementById('logContainer');
  if(!entries.length){c.innerHTML='<div class="empty-log">No letters logged yet</div>';return;}
  c.innerHTML=`<table class="log-table">${entries.map(l=>{
    const u=byId(l.userId); const col=u?clr(u.id):{bg:'#eee',text:'#888'};
    return `<tr>
      <td class="log-num">${pad(l.num)}</td>
      <td>
        <div class="log-who"><span class="log-dot" style="background:${col.text}"></span><span>${u?u.name:'Unknown'}</span></div>
        <div class="log-meta">${l.date} · ${l.time}</div>
      </td>
    </tr>`;
  }).join('')}</table>`;
}

function renderTeam(){
  document.getElementById('teamList').innerHTML=users.map(u=>{
    const c=clr(u.id);
    return `<div class="team-row">
      <div class="team-avatar" style="background:${c.bg};color:${c.text}">${ini(u.name)}</div>
      <div style="flex:1;min-width:0">
        <div class="team-name">${u.name}${u.isAdmin?' <span class="team-badge">Admin</span>':''}</div>
        <div class="team-role">${u.role}</div>
      </div>
    </div>`;
  }).join('');
}

// ── ACTIONS ────────────────────────────────────────────────
window.pickNumber = async ()=>{
  const num=currentNum+1;
  const now=new Date();
  const date=now.toLocaleDateString('en-GB').replace(/\//g,'-');
  const time=now.toTimeString().slice(0,5);
  await set(ref(db,'tracker/current'), num);
  await push(ref(db,'tracker/log'),{num, userId:activeUser.id, date, time});
  toast(`✓ Number ${pad(num)} logged by ${activeUser.name}`);
};

window.undoNumber = async ()=>{
  if(!logEntries.length) return;
  const last=logEntries[logEntries.length-1];
  if(last.userId!==activeUser.id){toast('You can only undo your own last entry.');return;}
  if(!confirm(`Undo number ${pad(currentNum)}?`)) return;
  const snap=await get(ref(db,'tracker/log'));
  const val=snap.val();
  if(val){
    const keys=Object.keys(val);
    await remove(ref(db,`tracker/log/${keys[keys.length-1]}`));
  }
  await set(ref(db,'tracker/current'),currentNum-1);
  toast('Entry undone.');
};

window.addUser = ()=>{
  const name=document.getElementById('aName').value.trim();
  const role=document.getElementById('aRole').value.trim();
  const pin=document.getElementById('aPin').value.trim();
  if(!name||pin.length<4){toast('Name and a 4-digit PIN are required.');return;}
  if(users.find(u=>u.name.toLowerCase()===name.toLowerCase())){toast('User already exists.');return;}
  users.push({id:nextUserId++,name,role:role||'Staff',pin,isAdmin:false});
  document.getElementById('aName').value='';
  document.getElementById('aRole').value='';
  document.getElementById('aPin').value='';
  renderLoginGrid(); renderTeam();
  toast(`✓ ${name} added.`);
};

// ── INIT ───────────────────────────────────────────────────
renderLoginGrid();
</script>
</body>
</html>
