<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCT Letter Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --border: #E4E7EC;
    --border-strong: #C8CFDA;
    --text-primary: #0F1621;
    --text-secondary: #5C6B80;
    --text-muted: #8A97A8;
    --blue: #1B4FBB;
    --blue-light: #EBF0FB;
    --blue-mid: #3B6FDF;
    --green: #0E7A52;
    --green-light: #E6F5EF;
    --red: #B42318;
    --red-light: #FEF0EE;
    --gold: #92600A;
    --gold-light: #FEF6E7;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 3px rgba(15,22,33,0.08), 0 1px 2px rgba(15,22,33,0.06);
    --shadow-md: 0 4px 12px rgba(15,22,33,0.10), 0 2px 4px rgba(15,22,33,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  input, select, button { font-family: inherit; font-size: 14px; }

  input[type="text"], input[type="password"], input[type="number"] {
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    outline: none;
    background: var(--surface);
    color: var(--text-primary);
    width: 100%;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--blue-mid); box-shadow: 0 0 0 3px rgba(59,111,223,0.12); }

  /* ── SCREENS ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── LOGIN ── */
  #loginScreen {
    min-height: 100vh;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  #loginScreen.active { display: flex; }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 420px;
  }

  .login-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1.75rem;
  }
  .logo-mark {
    width: 40px; height: 40px;
    background: var(--blue);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: white;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }
  .logo-text { line-height: 1.2; }
  .logo-text strong { font-size: 15px; font-weight: 600; display: block; }
  .logo-text span { font-size: 11px; color: var(--text-muted); }

  .login-card h2 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .login-card p { font-size: 13px; color: var(--text-secondary); margin-bottom: 1.5rem; }

  .user-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 1.25rem;
  }

  .user-card {
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 10px;
    cursor: pointer;
    text-align: center;
    background: var(--surface);
    transition: border-color 0.15s, background 0.15s;
  }
  .user-card:hover { border-color: var(--blue-mid); background: var(--blue-light); }
  .user-card.selected { border-color: var(--blue); background: var(--blue-light); }

  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    margin: 0 auto 8px;
  }
  .user-card .u-name { font-size: 13px; font-weight: 500; }
  .user-card .u-role { font-size: 10px; color: var(--text-muted); margin-top: 2px; line-height: 1.3; }

  .pin-field { margin-bottom: 1rem; }
  .pin-field label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 5px; font-weight: 500; }

  .login-btn {
    width: 100%;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    height: 42px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .login-btn:hover { background: var(--blue-mid); }

  .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }

  /* ── TRACKER ── */
  #trackerScreen {
    min-height: 100vh;
    display: none;
    flex-direction: column;
  }
  #trackerScreen.active { display: flex; }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-logo { display: flex; align-items: center; gap: 8px; }
  .topbar-logo .logo-mark { width: 30px; height: 30px; font-size: 11px; border-radius: 7px; }
  .topbar-logo span { font-size: 13px; font-weight: 600; }
  .topbar-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  .topbar-user { display: flex; align-items: center; gap: 8px; }
  .topbar-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
  .topbar-info { line-height: 1.2; }
  .topbar-name { font-size: 13px; font-weight: 500; }
  .topbar-role { font-size: 11px; color: var(--text-muted); }

  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; display: inline-block; transition: background 0.3s; }
  .sync-dot.synced { background: #22C55E; }
  .sync-dot.syncing { background: var(--gold); animation: pulse 1s infinite; }
  .sync-dot.error { background: var(--red); }
  .sync-label { font-size: 11px; color: var(--text-muted); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .logout-btn {
    background: none;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 0 12px;
    height: 30px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text-secondary);
  }
  .logout-btn:hover { background: var(--bg); }

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 0;
    max-width: 960px;
    margin: 0 auto;
    width: 100%;
    padding: 2rem 1.5rem;
    gap: 1.5rem;
  }

  @media (max-width: 700px) {
    .main { grid-template-columns: 1fr; padding: 1.25rem 1rem; }
    .sidebar { order: -1; }
  }

  /* ── COUNTER ── */
  .counter-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 2.5rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .counter-eyebrow { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.5rem; font-weight: 500; }

  .big-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 96px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1;
    letter-spacing: -2px;
  }

  .last-by {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 8px;
    min-height: 18px;
  }
  .last-by strong { color: var(--text-primary); }

  .divider { border: none; border-top: 1px solid var(--border); width: 100%; margin: 1.75rem 0; }

  .next-section { width: 100%; }
  .next-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.5rem; font-weight: 500; }
  .next-num-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 42px;
    font-weight: 500;
    color: var(--blue);
    background: var(--blue-light);
    border-radius: var(--radius);
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
  }

  .pick-btn {
    width: 100%;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    height: 48px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    margin-bottom: 8px;
  }
  .pick-btn:hover { background: var(--blue-mid); }
  .pick-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .undo-btn {
    width: 100%;
    background: none;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    height: 36px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-secondary);
  }
  .undo-btn:hover:not(:disabled) { background: var(--bg); }
  .undo-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ── SIDEBAR ── */
  .sidebar { display: flex; flex-direction: column; gap: 1rem; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* log table */
  .log-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .log-table td { padding: 8px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .log-table tr:last-child td { border-bottom: none; }
  .log-table tr:hover td { background: var(--bg); }
  .log-num { font-family: 'JetBrains Mono', monospace; font-weight: 500; color: var(--blue); font-size: 13px; }
  .log-who { display: flex; align-items: center; gap: 6px; }
  .log-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .log-meta { color: var(--text-muted); font-size: 11px; }
  .empty-log { padding: 1.5rem; text-align: center; color: var(--text-muted); font-size: 12px; }

  /* team panel */
  .team-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
  }
  .team-row:last-child { border-bottom: none; }
  .team-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .team-info { flex: 1; min-width: 0; }
  .team-name { font-size: 12px; font-weight: 500; }
  .team-role { font-size: 10px; color: var(--text-muted); }
  .team-badge { font-size: 10px; background: var(--gold-light); color: var(--gold); border-radius: 4px; padding: 1px 6px; font-weight: 500; }

  /* admin panel */
  .admin-form { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .admin-form input { font-size: 13px; }
  .admin-row-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .admin-add-btn {
    background: var(--blue);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    height: 34px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .admin-add-btn:hover { background: var(--blue-mid); }

  /* toast */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: #0F1621;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-mark">GCT</div>
      <div class="logo-text">
        <strong>Ghana Chamber of Telecom</strong>
        <span>Letter Reference Tracker</span>
      </div>
    </div>
    <h2>Sign in</h2>
    <p>Select your name, then enter your PIN.</p>
    <div class="user-grid" id="userGrid"></div>
    <div class="pin-field">
      <label>PIN</label>
      <input type="password" id="pinInput" maxlength="4" placeholder="Enter your 4-digit PIN" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- TRACKER -->
<div id="trackerScreen" class="screen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">
        <div class="logo-mark">GCT</div>
        <span>Letter Tracker</span>
      </div>
      <div class="topbar-sep"></div>
      <div class="topbar-user">
        <div class="topbar-avatar" id="tbAvatar"></div>
        <div class="topbar-info">
          <div class="topbar-name" id="tbName"></div>
          <div class="topbar-role" id="tbRole"></div>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="sync-dot" id="syncDot"></span>
      <span class="sync-label" id="syncLabel">Connecting…</span>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="main">
    <!-- Counter -->
    <div class="counter-panel">
      <div class="counter-eyebrow">Last number used</div>
      <div class="big-number" id="bigNum">000</div>
      <div class="last-by" id="lastBy"></div>

      <div class="divider"></div>

      <div class="next-section">
        <div class="next-label">Next number to use</div>
        <div class="next-num-display" id="nextNumDisplay">001</div>
        <button class="pick-btn" id="pickBtn" onclick="pickNumber()">
          Use number <span id="pickBtnNum">001</span>
        </button>
        <button class="undo-btn" id="undoBtn" onclick="undoNumber()" disabled>
          ↩ Undo my last entry
        </button>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Log -->
      <div class="panel">
        <div class="panel-head">
          <span>Usage log</span>
          <span id="logCount" style="font-weight:400;color:var(--text-muted)">0 entries</span>
        </div>
        <div id="logContainer" style="max-height:280px;overflow-y:auto;">
          <div class="empty-log">No letters logged yet</div>
        </div>
      </div>

      <!-- Team -->
      <div class="panel">
        <div class="panel-head">Team</div>
        <div id="teamList"></div>
      </div>

      <!-- Admin -->
      <div class="panel" id="adminPanel" style="display:none">
        <div class="panel-head">Admin — add team member</div>
        <div class="admin-form">
          <input type="text" id="aName" placeholder="Full name">
          <input type="text" id="aRole" placeholder="Role / title">
          <div class="admin-row-inputs">
            <input type="password" id="aPin" maxlength="4" placeholder="PIN (4 digits)">
          </div>
          <button class="admin-add-btn" onclick="addUser()">Add member</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── STORAGE KEY ───────────────────────────────────────────
const STORAGE_KEY = 'gct_tracker_state_v1';
const POLL_INTERVAL = 5000; // poll every 5s for real-time sync

// ─── USERS ─────────────────────────────────────────────────
let users = [
  { id: 1, name: "Obed",   role: "Digital Officer",              pin: "1984", isAdmin: true  },
  { id: 2, name: "Bobbie", role: "Research, Comms & Regulatory", pin: "2001", isAdmin: false },
  { id: 3, name: "David",  role: "Assist. Communications",       pin: "3003", isAdmin: false },
  { id: 4, name: "Alaina", role: "Admin & HR",                   pin: "4004", isAdmin: false },
];
let nextUserId = 5;

const AVATAR_COLORS = [
  { bg: "#DBEAFE", text: "#1D4ED8" },
  { bg: "#D1FAE5", text: "#065F46" },
  { bg: "#FEF3C7", text: "#92400E" },
  { bg: "#EDE9FE", text: "#5B21B6" },
  { bg: "#FFE4E6", text: "#9F1239" },
  { bg: "#DCFCE7", text: "#166534" },
];

function userColor(id) { return AVATAR_COLORS[(id - 1) % AVATAR_COLORS.length]; }
function initials(name) { return name.split(" ").map(w => w[0]).join("").toUpperCase().slice(0,2); }
function pad(n) { return String(n).padStart(3, "0"); }
function getUserById(id) { return users.find(u => u.id === id) || null; }

// ─── STATE ─────────────────────────────────────────────────
let state = { current: 0, log: [] };
let activeUser = null;
let selectedUserId = null;
let pollTimer = null;
let lastKnownCurrent = null;

// ─── PERSISTENT STORAGE (localStorage as shared sim) ───────
// On GitHub Pages with multiple users on different devices,
// we use localStorage + BroadcastChannel for same-device sync,
// plus a visible "Sync" button / poll interval for cross-device.

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    // Notify other tabs
    try { new BroadcastChannel('gct_tracker').postMessage({ type: 'update', state }); } catch(e) {}
  } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (typeof parsed.current === 'number' && Array.isArray(parsed.log)) {
        state = parsed;
        return true;
      }
    }
  } catch(e) {}
  return false;
}

// BroadcastChannel for same-browser tab sync
try {
  const bc = new BroadcastChannel('gct_tracker');
  bc.onmessage = (e) => {
    if (e.data?.type === 'update' && e.data.state) {
      const incoming = e.data.state;
      if (incoming.current !== state.current || incoming.log.length !== state.log.length) {
        state = incoming;
        if (activeUser) renderTracker();
        setSyncStatus('synced');
      }
    }
  };
} catch(e) {}

// ─── SYNC STATUS ───────────────────────────────────────────
function setSyncStatus(status) {
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  dot.className = 'sync-dot ' + status;
  label.textContent = status === 'synced' ? 'Live' : status === 'syncing' ? 'Syncing…' : 'Offline';
}

function startPolling() {
  stopPolling();
  setSyncStatus('synced');
  pollTimer = setInterval(() => {
    setSyncStatus('syncing');
    const fresh = loadState();
    setSyncStatus(fresh ? 'synced' : 'synced');
    if (activeUser) renderTracker();
  }, POLL_INTERVAL);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// ─── TOAST ─────────────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ─── LOGIN SCREEN ──────────────────────────────────────────
function renderLoginGrid() {
  document.getElementById('userGrid').innerHTML = users.map(u => {
    const c = userColor(u.id);
    return `<div class="user-card ${selectedUserId === u.id ? 'selected' : ''}" onclick="selectUser(${u.id})">
      <div class="avatar" style="background:${c.bg};color:${c.text}">${initials(u.name)}</div>
      <div class="u-name">${u.name}</div>
      <div class="u-role">${u.role}</div>
    </div>`;
  }).join('');
}

function selectUser(id) {
  selectedUserId = id;
  document.getElementById('pinInput').value = '';
  document.getElementById('loginErr').textContent = '';
  renderLoginGrid();
  document.getElementById('pinInput').focus();
}

function doLogin() {
  if (!selectedUserId) { document.getElementById('loginErr').textContent = 'Please select your name first.'; return; }
  const pin = document.getElementById('pinInput').value;
  const user = getUserById(selectedUserId);
  if (!user || user.pin !== pin) { document.getElementById('loginErr').textContent = 'Incorrect PIN — try again.'; return; }
  activeUser = user;
  document.getElementById('loginErr').textContent = '';
  loadState();
  showTracker();
}

function logout() {
  activeUser = null;
  selectedUserId = null;
  stopPolling();
  document.getElementById('pinInput').value = '';
  document.getElementById('loginScreen').classList.add('active');
  document.getElementById('trackerScreen').classList.remove('active');
  renderLoginGrid();
}

// ─── TRACKER SCREEN ────────────────────────────────────────
function showTracker() {
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('trackerScreen').classList.add('active');

  const c = userColor(activeUser.id);
  const av = document.getElementById('tbAvatar');
  av.textContent = initials(activeUser.name);
  av.style.background = c.bg;
  av.style.color = c.text;
  document.getElementById('tbName').textContent = activeUser.name;
  document.getElementById('tbRole').textContent = activeUser.role;

  if (activeUser.isAdmin) {
    document.getElementById('adminPanel').style.display = 'block';
  } else {
    document.getElementById('adminPanel').style.display = 'none';
  }

  renderTracker();
  startPolling();
}

function renderTracker() {
  const curr = state.current;
  const next = curr + 1;

  document.getElementById('bigNum').textContent = pad(curr);
  document.getElementById('nextNumDisplay').textContent = pad(next);
  document.getElementById('pickBtnNum').textContent = pad(next);

  // Last used by
  if (state.log.length > 0) {
    const last = state.log[state.log.length - 1];
    const u = getUserById(last.userId);
    document.getElementById('lastBy').innerHTML = u
      ? `Used by <strong>${u.name}</strong> · ${last.date} at ${last.time}`
      : `Used on ${last.date}`;
  } else {
    document.getElementById('lastBy').textContent = 'No letters logged yet';
  }

  // Undo: only if the last entry was mine
  const lastEntry = state.log.length > 0 ? state.log[state.log.length - 1] : null;
  const canUndo = lastEntry && lastEntry.userId === activeUser.id;
  document.getElementById('undoBtn').disabled = !canUndo;

  // Log table
  renderLog();

  // Team list
  renderTeam();

  // Flash if number changed externally
  if (lastKnownCurrent !== null && lastKnownCurrent !== curr) {
    const el = document.getElementById('bigNum');
    el.style.color = '#1B4FBB';
    setTimeout(() => el.style.color = '', 800);
    if (lastKnownCurrent < curr) {
      const last = state.log[state.log.length - 1];
      const u = getUserById(last?.userId);
      if (u && u.id !== activeUser.id) {
        toast(`${u.name} used number ${pad(curr)}`);
      }
    }
  }
  lastKnownCurrent = curr;
}

function renderLog() {
  const container = document.getElementById('logContainer');
  const entries = [...state.log].reverse();
  document.getElementById('logCount').textContent = `${state.log.length} ${state.log.length === 1 ? 'entry' : 'entries'}`;

  if (!entries.length) {
    container.innerHTML = '<div class="empty-log">No letters logged yet</div>';
    return;
  }

  container.innerHTML = `<table class="log-table">${entries.map(l => {
    const u = getUserById(l.userId);
    const c = u ? userColor(u.id) : { bg: '#eee', text: '#888' };
    return `<tr>
      <td class="log-num">${pad(l.num)}</td>
      <td>
        <div class="log-who">
          <span class="log-dot" style="background:${c.text}"></span>
          <span>${u ? u.name : 'Unknown'}</span>
        </div>
        <div class="log-meta">${l.date} · ${l.time}</div>
      </td>
    </tr>`;
  }).join('')}</table>`;
}

function renderTeam() {
  document.getElementById('teamList').innerHTML = users.map(u => {
    const c = userColor(u.id);
    return `<div class="team-row">
      <div class="team-avatar" style="background:${c.bg};color:${c.text}">${initials(u.name)}</div>
      <div class="team-info">
        <div class="team-name">${u.name} ${u.isAdmin ? '<span class="team-badge">Admin</span>' : ''}</div>
        <div class="team-role">${u.role}</div>
      </div>
    </div>`;
  }).join('');
}

// ─── ACTIONS ───────────────────────────────────────────────
function pickNumber() {
  const now = new Date();
  const date = now.toLocaleDateString('en-GB').replace(/\//g, '-');
  const time = now.toTimeString().slice(0, 5);
  state.current++;
  state.log.push({ num: state.current, userId: activeUser.id, date, time });
  saveState();
  renderTracker();
  toast(`✓ Number ${pad(state.current)} logged by ${activeUser.name}`);
}

function undoNumber() {
  if (!state.log.length) return;
  const last = state.log[state.log.length - 1];
  if (last.userId !== activeUser.id) { toast('You can only undo your own last entry.'); return; }
  if (!confirm(`Undo number ${pad(state.current)}?`)) return;
  state.log.pop();
  state.current--;
  saveState();
  renderTracker();
  toast('Entry undone.');
}

// ─── ADMIN ─────────────────────────────────────────────────
function addUser() {
  const name = document.getElementById('aName').value.trim();
  const role = document.getElementById('aRole').value.trim();
  const pin  = document.getElementById('aPin').value.trim();
  if (!name || !pin || pin.length < 4) { toast('Name and a 4-digit PIN are required.'); return; }
  if (users.find(u => u.name.toLowerCase() === name.toLowerCase())) { toast('A user with that name already exists.'); return; }
  users.push({ id: nextUserId++, name, role: role || 'Staff', pin, isAdmin: false });
  document.getElementById('aName').value = '';
  document.getElementById('aRole').value = '';
  document.getElementById('aPin').value = '';
  renderLoginGrid();
  renderTracker();
  toast(`✓ ${name} added.`);
}

// ─── INIT ──────────────────────────────────────────────────
renderLoginGrid();
</script>
</body>
</html>
